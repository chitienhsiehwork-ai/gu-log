onlyBuiltDependencies:
  - esbuild
  - sharp

# 7 days in minutes; reduces exposure to newly compromised releases.
minimumReleaseAge: 10080

# Security-only exception: GHSA-2v37-7h3g-55p8 is fixed in nanoid 3.3.18.
minimumReleaseAgeExclude:
  - nanoid@3.3.18

overrides:
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  serialize-javascript@<=7.0.2: '>=7.0.3'
  tmp: 0.2.7
  smol-toml: '>=1.7.1'
  fast-uri: '>=3.1.7 <4'
  js-yaml@>=3.0.0 <3.15.2: 3.15.2
  js-yaml@>=4.0.0 <4.3.2: 4.3.2
