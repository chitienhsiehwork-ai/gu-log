# Dependency overrides and onlyBuiltDependencies live only in package.json
# ("pnpm" field): pnpm-lock.yaml records that set, and scripts/security-gate.mjs
# checks the two match. Do not add them here.

# 7 days in minutes; reduces exposure to newly compromised releases.
minimumReleaseAge: 10080

# Security-only exceptions: GHSA-2v37-7h3g-55p8 is fixed in nanoid 3.3.18;
# GHSA-ch52-4w7c-c8xp (astro runtime dep) is fixed in http-cache-semantics 4.3.0;
# the body-parser high advisory (LHCI dev dep via express) is fixed in body-parser 1.20.9.
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  - http-cache-semantics@4.3.0
  - body-parser@1.20.9
