  - slug: gp-102-20260304-systematicls-agentic-engineer
    frontmatter:
      ticketId: GP-102
      title: "世界級 Agentic Engineer 的真相 — 少裝一點，反而飛更快"
      originalDate: "2026-03-03"
      translatedDate: "2026-03-04"
      source: "@systematicls on X"
      sourceUrl: "https://x.com/systematicls/status/2028814227004395561"
      lang: zh-tw
      summary: "（合成摘要）GP-102 翻譯 @systematicls 談 agentic engineering 的長推文：與其一直加工具，不如管好 context、把研究和實作分開，並把任務終點寫成可驗證的條件。"
    contentSnapshot: |
      （合成摘要，不含譯文原句）這篇 GP 翻譯 @systematicls 一則談 agentic engineering 的長推文。
      主軸是系統設計與資訊流：作者認為 agent 表現不穩，多半不是模型或工具不夠，而是 context
      塞了太多不相干的東西。文章依序談到：用精簡的 CLI 工作流起步、把研究和實作拆成不同階段、
      用中性的提問降低 sycophancy、compaction 之後重讀任務、把「做完」寫成可驗證的條件（測試
      不得改、必要時截圖），以及定期清掉互相矛盾的 rules。落點在工程紀律與資訊架構，而不是
      單次對話的技巧。
